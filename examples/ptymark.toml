# @dependency-start
# contract configuration
# responsibility Provides a minimal portable schema-v2 user configuration fixture.
# upstream design ../documents/alpha4-design.md configuration ownership
# downstream implementation ../src/config.rs configuration parser and resolver
# downstream implementation ../tests/cli_contract.rs fixture validation
# @dependency-end

schema_version = 2
default_profile = "default"

[profiles.default.session]
mode = "render" # render | source
strict = false

[profiles.default.detection]
mermaid = true
math = true

[profiles.default.presentation]
mode = "auto" # auto | symbols | plain | source
# auto enables contrast-safe ANSI only with --color; always forces it; never
# uses terminal-default foreground/background and emits no color SGR.
color = "auto" # auto | always | never
fallback_columns = 80

[profiles.default.cache]
backend = "memory" # none | memory
max_entries = 128
max_bytes = 33554432

# `auto` keeps the user's portable intent in this file. Executable paths found
# by the installer are recorded in installation state, not copied into TOML.
[profiles.default.engines.mermaid]
provider = "auto" # auto | preview | source | managed | external

[profiles.default.engines.math]
provider = "auto" # auto | preview | source | managed | external

[profiles.default.engines.presenter]
provider = "auto" # auto | managed | external

# An explicit external program is written only by direct user choice:
# [profiles.default.engines.math]
# provider = "external"
# program = "/opt/tools/tex2svg"
