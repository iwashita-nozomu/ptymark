# @dependency-start
# contract workflow
# responsibility Blocks pull requests that introduce product dependencies with known moderate-or-higher vulnerabilities.
# upstream environment ../dependabot.yml proposes dependency updates
# upstream environment ../../Cargo.lock resolved Rust dependency graph
# upstream environment ../../renderers/package-lock.json resolved renderer dependency graph
# upstream environment ../../docker/ptymark.Dockerfile canonical validation image
# downstream design ../../SECURITY.md vulnerability reporting and support policy
# downstream implementation ../../scripts/check-workflow-policy.py immutable Action refs
# @dependency-end

name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/ptymark.Dockerfile"
      - "docker/ptymark-compose.yaml"
      - "docker/ptymark-versions.env"
      - "renderers/package.json"
      - "renderers/package-lock.json"
      - "renderers/managed-bundle.env"
      - ".github/dependabot.yml"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency vulnerability review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
