# @dependency-start
# contract configuration
# responsibility Generates advisory AgentCanon improvement guidance only when agent surfaces change.
# upstream design ../../agents/workflows/agent-canon-pr-workflow.md PR evidence rules
# upstream implementation ../../tools/agent_tools/generate_agent_improvement_guide.py builds the guide
# upstream implementation ../scripts/checkout_agent_canon_submodule.sh checks out AgentCanon
# @dependency-end

name: Agent Improvement Guide

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "agents/**"
      - ".agents/**"
      - ".codex/**"
      - "tools/agent_tools/**"
      - "vendor/agent-canon"
      - "vendor/agent-canon/**"
      - ".github/workflows/agent-*.yml"
      - ".github/scripts/checkout_agent_canon_submodule.sh"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "agents/**"
      - ".agents/**"
      - ".codex/**"
      - "tools/agent_tools/**"
      - "vendor/agent-canon"
      - "vendor/agent-canon/**"
      - ".github/workflows/agent-*.yml"
      - ".github/scripts/checkout_agent_canon_submodule.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-improvement-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guide:
    name: Advisory agent improvement guide
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: false
          persist-credentials: false

      - name: Check out AgentCanon submodule
        run: bash .github/scripts/checkout_agent_canon_submodule.sh

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Generate improvement guide
        id: guide
        shell: bash
        run: |
          set -euo pipefail
          canon_root="${GITHUB_WORKSPACE}/vendor/agent-canon"
          report_dir="${GITHUB_WORKSPACE}/reports/agent-improvement-guide"
          mkdir -p "${canon_root}/.agent-canon/log-archive" "$report_dir"
          guide_path="${report_dir}/agent-improvement-guide-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          export AGENT_CANON_HOOK_ARCHIVE_DIR="${canon_root}/.agent-canon/log-archive"
          python3 "${canon_root}/tools/agent_tools/generate_agent_improvement_guide.py" --root "$canon_root" --out "$guide_path"
          cat "$guide_path" >> "$GITHUB_STEP_SUMMARY"
          echo "guide_path=$guide_path" >> "$GITHUB_OUTPUT"

      - name: Upload improvement guide
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-improvement-guide-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.guide.outputs.guide_path }}
          retention-days: 7
