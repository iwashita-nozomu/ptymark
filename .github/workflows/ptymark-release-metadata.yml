# @dependency-start
# contract workflow
# responsibility Validates version, packaging, and source-only release metadata.
# upstream design ../../documents/release.md publication contract
# upstream implementation ../../scripts/check-release-metadata.py tree validator
# upstream implementation ../../tests/tools/test_release_metadata.py metadata tests
# downstream implementation ./ptymark-release.yml publication workflow
# @dependency-end

name: ptymark Release Metadata

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
      - SECURITY.md
      - documents/release.md
      - "release-notes/**"
      - scripts/check-release-metadata.py
      - scripts/package-release.sh
      - scripts/package-release.ps1
      - tests/tools/test_release_metadata.py
      - ".github/workflows/ptymark-release*.yml"
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
      - SECURITY.md
      - documents/release.md
      - "release-notes/**"
      - scripts/check-release-metadata.py
      - scripts/package-release.sh
      - scripts/package-release.ps1
      - tests/tools/test_release_metadata.py
      - ".github/workflows/ptymark-release*.yml"
  workflow_dispatch:

concurrency:
  group: ptymark-release-metadata-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Validate release tree
        run: python3 scripts/check-release-metadata.py

      - name: Run release metadata contracts
        run: python3 -m unittest tests.tools.test_release_metadata -v
