# Temporary Alpha.4 code-scanning diagnostic. Remove after the protected analysis identity is confirmed.
name: Alpha.4 code-scanning diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/alpha4-code-scanning-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

concurrency:
  group: alpha4-code-scanning-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/alpha4-typed-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Inspect current CodeQL analysis identities
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${REPOSITORY}/code-scanning/analyses?tool_name=CodeQL&per_page=100" \
            --jq ".[] | select(.commit_sha == \"${HEAD_SHA}\" or .commit_sha == \"${MERGE_SHA}\" or .ref == \"refs/pull/${PR_NUMBER}/head\" or .ref == \"refs/pull/${PR_NUMBER}/merge\" or .ref == \"refs/heads/${HEAD_REF}\") | {id,ref,commit_sha,analysis_key,environment,category,error,results_count,rules_count,tool:.tool.name,created_at}"
