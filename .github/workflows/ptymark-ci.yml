# @dependency-start
# contract workflow
# responsibility Runs product-owned cross-platform merge gates and defers heavyweight packaging to release changes.
# upstream design ../../documents/ptymark-design.md terminal-safety architecture
# upstream environment ../../rust-toolchain.toml supported Rust toolchain
# downstream design ../../verification/README.md merge evidence policy
# downstream implementation ../../tests/verification_manifest_contract.rs catalog validation
# downstream implementation ../../scripts/check-workflow-policy.py immutable Action refs and PR gate policy
# @dependency-end

name: ptymark CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "GNUmakefile"
      - "Makefile"
      - "ptymark.mk"
      - "src/**"
      - "tests/**"
      - "plugin/**"
      - "renderers/**"
      - "scripts/**"
      - "distribution/**"
      - "compat/**"
      - "verification/**"
      - "docker/ptymark*"
      - "examples/**"
      - "documents/ptymark-*.md"
      - "documents/shell-plugin-compatibility.md"
      - "README.md"
      - "CHANGELOG.md"
      - "release-notes/**"
      - ".github/workflows/ptymark-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ptymark-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify product verification surfaces
    runs-on: ubuntu-24.04
    outputs:
      installer: ${{ steps.classify.outputs.installer }}
      docker: ${{ steps.classify.outputs.docker }}
      release: ${{ steps.classify.outputs.release }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: false
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          installer=false
          docker=false
          release=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$REF_NAME" == refs/tags/v* ]]; then
            installer=true
            docker=true
            release=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base_sha="$PR_BASE_SHA"
              head_sha="$PR_HEAD_SHA"
            else
              base_sha="$PUSH_BASE_SHA"
              head_sha="$PUSH_HEAD_SHA"
            fi
            if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
              base_sha="$(git rev-list --max-parents=0 "$head_sha" | tail -n 1)"
            fi
            git diff --name-only "$base_sha" "$head_sha" > changed-paths.txt
            cat changed-paths.txt

            while IFS= read -r path; do
              case "$path" in
                Cargo.toml|Cargo.lock|CHANGELOG.md|release-notes/*|.github/workflows/ptymark-release*.yml)
                  release=true
                  ;;
              esac
              case "$path" in
                src/config.rs|src/install.rs|src/managed_launcher.rs|src/engine.rs|scripts/*|distribution/*|compat/*|renderers/*|tests/install*|tests/managed*|tests/fresh_source*|tests/windows*|tests/shell_profile*|.github/workflows/ptymark-ci.yml)
                  installer=true
                  ;;
              esac
              case "$path" in
                docker/ptymark*|docker/ptymark/*|docker/ptymark-*|.github/workflows/ptymark-ci.yml)
                  docker=true
                  ;;
              esac
            done < changed-paths.txt
          fi

          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  native:
    name: Native Rust checks (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: false
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.0

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Verify Unix shell profiles and hook coexistence
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked
          bash tests/shell_profile_coexistence.sh target/debug/ptymark

  windows-frontends:
    name: Windows PowerShell, cmd, WinBash, and profile coexistence
    needs: changes
    if: needs.changes.outputs.installer == 'true' || needs.changes.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: false
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0

      - name: Parse installer and package frontends
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/installer.ps1',
            'scripts/install.ps1',
            'scripts/install-managed-bundle.ps1',
            'distribution/install.ps1',
            'tests/windows_managed_renderer_smoke.ps1',
            'tests/windows_shell_profile_coexistence.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$path parser errors: $($errors -join '; ')" }
          }
          bash -n scripts/installer.sh scripts/install.sh scripts/install-managed-bundle.sh distribution/install.sh tests/fresh_source_acceptance.sh tests/managed_renderer_smoke.sh tests/shell_profile_coexistence.sh

      - name: Build native binary
        run: cargo build --locked

      - name: Run Git Bash frontend with native path conversion
        shell: bash
        run: |
          set -euo pipefail
          binary="$(cygpath -u "$GITHUB_WORKSPACE/target/debug/ptymark.exe")"
          root="$(cygpath -u "$RUNNER_TEMP")/ptymark-git-bash"
          rm -rf "$root"
          bash scripts/installer.sh --skip-core --binary "$binary" --managed never --mermaid preview --math preview --config "$root/config.toml" --state "$root/state.toml"
          grep -F 'provider = "preview"' "$root/config.toml" >/dev/null
          grep -F 'config_path = ' "$root/state.toml" >/dev/null

      - name: Run cmd.exe frontend
        shell: cmd
        run: |
          scripts\installer.cmd -SkipCore -Binary "%GITHUB_WORKSPACE%\target\debug\ptymark.exe" -Managed never -Mermaid preview -Math preview -Config "%RUNNER_TEMP%\ptymark-cmd\config.toml" -State "%RUNNER_TEMP%\ptymark-cmd\state.toml"
          if errorlevel 1 exit /b 1

      - name: Verify Windows shell profiles and hook coexistence
        shell: pwsh
        run: '& ./tests/windows_shell_profile_coexistence.ps1 -Binary ((Resolve-Path ''target/debug/ptymark.exe'').Path) -Root (Join-Path $env:RUNNER_TEMP ''ptymark-shell-coexistence'')'

  canonical-docker:
    name: Canonical Docker checks
    needs: changes
    if: needs.changes.outputs.installer == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: false
          persist-credentials: false

      - name: Build canonical image
        run: docker compose --env-file docker/ptymark-versions.env --file docker/ptymark-compose.yaml build --pull

      - name: Check product scripts and WezTerm plugin
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --env-file docker/ptymark-versions.env --file docker/ptymark-compose.yaml)
          scripts=(scripts/check-ptymark-renderers.sh scripts/installer.sh scripts/install.sh scripts/install-managed-bundle.sh distribution/install.sh tests/fresh_source_acceptance.sh tests/install_smoke.sh tests/managed_renderer_smoke.sh tests/shell_profile_coexistence.sh)
          "${compose[@]}" run --rm --no-TTY dev bash -n "${scripts[@]}"
          "${compose[@]}" run --rm --no-TTY dev shellcheck "${scripts[@]}"
          "${compose[@]}" run --rm --no-TTY dev node --check renderers/managed/mathjax-cli.mjs
          "${compose[@]}" run --rm --no-TTY dev node --check renderers/managed/ansi-presenter.mjs
          "${compose[@]}" run --rm --no-TTY dev lua5.4 tests/plugin_smoke.lua

      - name: Run installer and shell coexistence acceptance
        run: docker compose --env-file docker/ptymark-versions.env --file docker/ptymark-compose.yaml run --rm --no-TTY dev bash -lc 'cargo build --locked && bash tests/install_smoke.sh && bash tests/shell_profile_coexistence.sh "${CARGO_TARGET_DIR}/debug/ptymark"'

      - name: Run isolated managed-renderer acceptance
        run: docker compose --env-file docker/ptymark-versions.env --file docker/ptymark-compose.yaml run --rm --no-TTY dev bash -lc 'cargo build --locked && PTYMARK_TEST_BROWSER=/usr/bin/chromium PTYMARK_BROWSER_NO_SANDBOX=1 bash tests/managed_renderer_smoke.sh && bash scripts/check-ptymark-renderers.sh'

      - name: Run fresh-source installation acceptance
        run: docker compose --env-file docker/ptymark-versions.env --file docker/ptymark-compose.yaml run --rm --no-TTY dev bash -lc 'PTYMARK_TEST_BROWSER=/usr/bin/chromium PTYMARK_BROWSER_NO_SANDBOX=1 bash tests/fresh_source_acceptance.sh'

  windows-managed-renderers:
    name: Windows managed renderer installation and strict rendering
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 80

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: false
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0

      - name: Install managed-bundle Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Build native binary
        run: cargo build --locked

      - name: Locate Chromium-compatible browser
        id: browser
        shell: pwsh
        run: |
          $candidates = @()
          if (${env:ProgramFiles(x86)}) {
            $candidates += Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe'
            $candidates += Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'
          }
          if ($env:ProgramFiles) {
            $candidates += Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'
            $candidates += Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          }
          $browser = $candidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (-not $browser) { throw 'No Chromium-compatible browser is installed' }
          "path=$browser" >> $env:GITHUB_OUTPUT

      - name: Install managed defaults and render Mermaid and math
        shell: pwsh
        env:
          BROWSER_PATH: ${{ steps.browser.outputs.path }}
        run: '& ./tests/windows_managed_renderer_smoke.ps1 -Binary ((Resolve-Path ''target/debug/ptymark.exe'').Path) -Browser $env:BROWSER_PATH -Root (Join-Path $env:RUNNER_TEMP ''ptymark-managed-windows'')'

  local-package-smoke:
    name: Cross-platform local package smoke (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, label: linux}
          - {os: macos-latest, label: macos}
          - {os: windows-latest, label: windows}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: false
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0

      - name: Build release executable
        run: cargo build --release --locked

      - name: Package and smoke-test Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/package-release.sh target/release/ptymark dist

      - name: Package and smoke-test Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& ./scripts/package-release.ps1 -Binary ((Resolve-Path ''target/release/ptymark.exe'').Path) -OutputDir (Join-Path $env:GITHUB_WORKSPACE ''dist'')'

      - name: Discard local package output
        shell: bash
        run: test -d dist && rm -rf dist

  gate:
    name: Ptymark PR Gate
    if: always()
    needs: [changes, native, windows-frontends, canonical-docker, windows-managed-renderers, local-package-smoke]
    runs-on: ubuntu-24.04

    steps:
      - name: Require all selected product checks
        env:
          NATIVE: ${{ needs.native.result }}
          WINDOWS_FRONTENDS: ${{ needs.windows-frontends.result }}
          DOCKER: ${{ needs.canonical-docker.result }}
          WINDOWS_MANAGED: ${{ needs.windows-managed-renderers.result }}
          PACKAGES: ${{ needs.local-package-smoke.result }}
        run: |
          set -euo pipefail
          for result in "$NATIVE" "$WINDOWS_FRONTENDS" "$DOCKER" "$WINDOWS_MANAGED" "$PACKAGES"; do
            case "$result" in
              success|skipped) ;;
              *) echo "selected product check result: $result" >&2; exit 1 ;;
            esac
          done
