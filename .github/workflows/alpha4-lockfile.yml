# Temporary alpha.4 branch-only workflow. Remove before merging the release PR.
name: alpha4 one-shot source fixup

on:
  push:
    branches: [agent/alpha4-typed-config]
    paths:
      - "scripts/alpha4_fixup.py"
      - ".github/workflows/alpha4-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha4-one-shot-fixup
  cancel-in-progress: false

jobs:
  fixup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out alpha4 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/alpha4-typed-config
          persist-credentials: true
          submodules: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.0

      - name: Apply reviewed source fixes
        run: python3 scripts/alpha4_fixup.py

      - name: Normalize generated and Rust sources
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Validate source tree before publishing the fix
        run: |
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Commit validated fixup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'alpha4 source tree already contains the reviewed fixup'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock src
          git commit -m 'fix: complete alpha4 typed configuration integration'
          git push origin HEAD:agent/alpha4-typed-config
