# Temporary same-repository workflow. It deletes itself after committing the validated product-only tree.
name: alpha4 product-only migration

on:
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "tests/**"
      - "scripts/alpha4_fixup.py"
      - "scripts/alpha4_cli_fixup.py"
      - "scripts/remove_agent_canon.py"
      - ".github/workflows/alpha4-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha4-product-only-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.head_ref == 'agent/alpha4-typed-config' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out fixed alpha4 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/alpha4-typed-config
          persist-credentials: true
          submodules: false
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.0

      - name: Apply reviewed Alpha.4 source fixes
        run: |
          python3 scripts/alpha4_fixup.py
          python3 scripts/alpha4_cli_fixup.py

      - name: Remove inherited AgentCanon and template surfaces
        run: python3 scripts/remove_agent_canon.py

      - name: Normalize lockfile and Rust sources
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Validate product-only source tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git ls-files -s | awk '$1 == 160000 { print }')"
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          node scripts/check-ptymark-runtime-dependencies.mjs
          python3 scripts/check-release-metadata.py
          python3 -m unittest tests.tools.test_release_metadata -v
          bash -n \
            scripts/check-ptymark-renderers.sh \
            scripts/installer.sh \
            scripts/install.sh \
            scripts/install-managed-bundle.sh \
            scripts/package-release.sh \
            distribution/install.sh \
            tests/install_smoke.sh \
            tests/managed_renderer_smoke.sh \
            tests/shell_profile_coexistence.sh

      - name: Commit validated product-only migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'product-only Alpha.4 tree is already current'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'refactor: remove AgentCanon and keep product-only CI'
          git push origin HEAD:agent/alpha4-typed-config
