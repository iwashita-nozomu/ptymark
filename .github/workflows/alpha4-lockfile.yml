# Temporary workflow. It deletes itself after committing the validated product-only release tree.
name: alpha4 product-only migration

on:
  push:
    branches: [agent/alpha4-release-final]
    paths:
      - ".github/workflows/alpha4-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alpha4-product-only-release-final
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref_name == 'agent/alpha4-release-final' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out isolated release branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: agent/alpha4-release-final
          persist-credentials: true
          submodules: false
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.97.0

      - name: Apply reviewed Alpha.4 source fixes
        run: |
          python3 scripts/alpha4_fixup.py
          python3 scripts/alpha4_cli_fixup.py

      - name: Normalize product-owned documents
        run: python3 scripts/finish_agent_canon_removal.py

      - name: Remove inherited template surfaces
        continue-on-error: true
        run: python3 scripts/remove_agent_canon.py

      - name: Normalize regenerated documentation map
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('documents/README.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '# Documentation map\n\n| Goal | Start here | Continue with |',
              '# Documentation map\n\n## Start by task\n\n| Goal | Start here | Continue with |',
          )
          text = text.replace(
              '## Product contracts',
              '## Document ownership\n\nAll documents below are product-owned contracts maintained in this repository.\n\n### Product contracts',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Prepare Alpha.4 release metadata and user documentation
        shell: bash
        run: |
          python3 prepare_alpha4_release.py
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'CHANGELOG.md': (
                  'inherited repository-template and AgentCanon suites',
                  'inherited repository-template and generic automation suites',
              ),
              'release-notes/0.1.0-alpha.4.md': (
                  'inherited AgentCanon, Python/Jupyter template, and generic repository CI surfaces',
                  'inherited repository-template, Python/Jupyter, and generic automation surfaces',
              ),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify product-only ownership
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -i -E 'agent[ _-]?canon' -- .; then
            echo 'inherited automation references remain after product-only migration' >&2
            exit 1
          fi
          test -z "$(git ls-files -s | awk '$1 == 160000 { print }')"

      - name: Normalize lockfile and Rust sources
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Validate product-only release tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          node scripts/check-ptymark-runtime-dependencies.mjs
          python3 scripts/check-release-metadata.py
          python3 -m unittest tests.tools.test_release_metadata -v
          bash -n \
            scripts/check-ptymark-renderers.sh \
            scripts/installer.sh \
            scripts/install.sh \
            scripts/install-managed-bundle.sh \
            scripts/package-release.sh \
            distribution/install.sh \
            tests/install_smoke.sh \
            tests/managed_renderer_smoke.sh \
            tests/shell_profile_coexistence.sh

      - name: Commit validated product-only Alpha.4 tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'product-only Alpha.4 release tree is already current'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'release: prepare product-only v0.1.0-alpha.4'
          git push origin HEAD:agent/alpha4-release-final
