# Lightweight repository wiring check. Product behavior is owned by ptymark-ci.yml.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-ci:
    name: Repository CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: false

      - name: Record immutable source identity
        shell: bash
        run: |
          echo "source commit: $(git rev-parse HEAD)"
          echo "source tree: $(git rev-parse 'HEAD^{tree}')"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup override set 1.97.0

      - name: Validate repository wiring and workflow policy
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            git diff --check HEAD^1 HEAD
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          python3 scripts/check-workflow-policy.py
          python3 -m unittest tests.tools.test_workflow_policy -v
