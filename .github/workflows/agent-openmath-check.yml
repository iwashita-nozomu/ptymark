name: Agent OpenMath branch check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-openmath-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-check-and-apply:
    if: github.event.pull_request.head.ref == 'agent/openmath-doc-navigation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v7
        with:
          ref: agent/openmath-doc-navigation
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy

      - name: Apply the validated fixes and rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count not in (0, 1):
                  raise SystemExit(f"{path}: unexpected match count {count} for {old!r}")
              if count == 1:
                  target.write_text(source.replace(old, new), encoding="utf-8")

          replace_once(
              "src/openmath.rs",
              'br#"<OMOBJ xmlns="http://www.openmath.org/OpenMath"><OMR href="#other"/></OMOBJ>"#',
              'br##"<OMOBJ xmlns="http://www.openmath.org/OpenMath"><OMR href="#other"/></OMOBJ>"##',
          )
          replace_once(
              "src/openmath.rs",
              """    if let OpenMathObject::Symbol(symbol) = operator {
                  if let Some(rendered) = render_known_application(symbol, arguments) {
                      return rendered;
                  }
              }
          """,
              """    if let OpenMathObject::Symbol(symbol) = operator
                  && let Some(rendered) = render_known_application(symbol, arguments)
              {
                  return rendered;
              }
          """,
          )
          replace_once(
              "src/render.rs",
              'format!("┌─ ptymark {} ─\\n", block.format())',
              'format!("┌─ ptymark {} ─\\n", block.kind())',
          )
          replace_once(
              "src/render.rs",
              "fn preview_identifies_the_concrete_source_format()",
              "fn preview_keeps_the_stable_semantic_role()",
          )
          replace_once(
              "src/render.rs",
              '.contains("ptymark openmath")',
              '.contains("ptymark math")',
          )
          PY
          cargo +1.97.0 fmt --all
          git diff --binary > format.patch
          tar -cf formatted-rust.tar src tests

      - name: Check all Rust targets
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo +1.97.0 check --all-targets --locked --message-format short 2>&1 | tee check.log

      - name: Run Clippy with warnings denied
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo +1.97.0 clippy --all-targets --locked -- -D warnings 2>&1 | tee clippy.log

      - name: Run all Rust tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo +1.97.0 test --all-targets --locked 2>&1 | tee tests.log

      - name: Upload formatting and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-openmath-format-and-diagnostics
          path: |
            format.patch
            formatted-rust.tar
            check.log
            clippy.log
            tests.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit the validated fixes and formatting
        if: steps.check.outcome == 'success' && steps.clippy.outcome == 'success' && steps.tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          git commit -m "fix: validate and format OpenMath support"
          git push origin HEAD:agent/openmath-doc-navigation

      - name: Preserve validation result
        if: always()
        shell: bash
        run: |
          test '${{ steps.check.outcome }}' = success
          test '${{ steps.clippy.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
