name: Agent OpenMath branch check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: agent-openmath-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-and-check:
    if: github.event.pull_request.head.ref == 'agent/openmath-doc-navigation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy

      - name: Apply rustfmt and package the formatted source
        id: format
        shell: bash
        run: |
          set +e
          cargo +1.97.0 fmt --all 2>&1 | tee fmt.log
          format_status=${PIPESTATUS[0]}
          git diff --binary > format.patch
          tar -cf formatted-rust.tar src tests
          echo "status=${format_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check all Rust targets
        id: check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo +1.97.0 check --all-targets --locked --message-format short 2>&1 | tee check.log

      - name: Run Clippy with warnings denied
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo +1.97.0 clippy --all-targets --locked -- -D warnings 2>&1 | tee clippy.log

      - name: Run focused OpenMath and documentation tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo +1.97.0 test --locked openmath 2>&1 | tee openmath-tests.log
          cargo +1.97.0 test --locked --test documentation_contract 2>&1 | tee documentation-tests.log

      - name: Upload formatting and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-openmath-format-and-diagnostics
          path: |
            fmt.log
            format.patch
            formatted-rust.tar
            check.log
            clippy.log
            openmath-tests.log
            documentation-tests.log
          if-no-files-found: warn
          retention-days: 1

      - name: Preserve validation result
        if: always()
        shell: bash
        run: |
          test '${{ steps.format.outputs.status }}' = 0
          test '${{ steps.check.outcome }}' = success
          test '${{ steps.clippy.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
