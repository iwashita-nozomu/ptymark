name: Agent OpenMath branch check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-openmath-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-apply-document-fix:
    if: github.event.pull_request.head.ref == 'agent/openmath-doc-navigation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v7
        with:
          ref: agent/openmath-doc-navigation
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy

      - name: Repair the nested Markdown fence and lock the route contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text(encoding="utf-8")
              count = source.count(old)
              if count not in (0, 1):
                  raise SystemExit(f"{path}: unexpected match count {count} for {old!r}")
              if count == 1:
                  target.write_text(source.replace(old, new), encoding="utf-8")

          replace_once(
              "documents/ptymark-design.md",
              """```text
          ```mermaid ... ```
          $$ ... $$
          ```math|latex|tex ... ```
          ```openmath ... ```
          ```""",
              """````text
          ```mermaid ... ```
          $$ ... $$
          ```math|latex|tex ... ```
          ```openmath ... ```
          ````""",
          )
          replace_once(
              "tests/documentation_contract.rs",
              '    assert!(!DESIGN.contains("30-second wall-clock cold-start ceiling"));\n}',
              '    assert!(!DESIGN.contains("30-second wall-clock cold-start ceiling"));\n    assert!(DESIGN.contains("````text\\n```mermaid ... ```"));\n}',
          )
          PY

      - name: Validate Rust and documentation contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.0 fmt --all -- --check
          cargo +1.97.0 check --all-targets --locked
          cargo +1.97.0 clippy --all-targets --locked -- -D warnings
          cargo +1.97.0 test --all-targets --locked
          git diff --check

      - name: Commit the validated document fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add documents/ptymark-design.md tests/documentation_contract.rs
          git commit -m "docs: preserve literal semantic fence examples"
          git push origin HEAD:agent/openmath-doc-navigation
